spring:
  application:
    name: DisruptFlow
  lifecycle:
    timeout-per-shutdown-phase: 45s
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql-prod:3306/disrupt_flow?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:disruptflow}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 20
      maximum-pool-size: 80
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.chenxiaofei.disruptflow.model
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  enabled: true
  name-server: ${ROCKETMQ_NAMESRV_ADDR:127.0.0.1:9876}
  producer-group: ${ROCKETMQ_PRODUCER_GROUP:DisruptFlowProducerGroup}
  consumer-group: ${ROCKETMQ_CONSUMER_GROUP:DisruptFlowConsumerGroup}
  send-msg-timeout: 3000
  retry-times-when-send-failed: 2
  retry-times-when-send-async-failed: 2
  max-message-size: 4194304
  compress-msg-body-over-howmuch: 4096
  retry-another-broker-when-not-store-ok: false
  producer:
    retry-disruptor-topic: ${RETRY_DISRUPTOR_TOPIC:disruptorFlowException}
    retry-disruptor-tags: ${RETRY_DISRUPTOR_TAGS:disruptorFlowException}

async-push-disruptor-flow-executor:
  core-pool-size: ${ASYNC_CORE_POOL_SIZE:32}
  max-pool-size: ${ASYNC_MAX_POOL_SIZE:64}
  keep-alive-time: ${ASYNC_KEEP_ALIVE_MS:1000}
  queue-size: ${ASYNC_QUEUE_SIZE:2000}

retry-disruptor:
  failed-count-limit: ${RETRY_FAILED_COUNT_LIMIT:8}
  buffer-size: ${RETRY_DISRUPTOR_BUFFER_SIZE:4096}
  worker-multiplier: ${RETRY_DISRUPTOR_WORKER_MULTIPLIER:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    probes:
      enabled: true

logging:
  level:
    root: INFO
    com.chenxiaofei.disruptflow: INFO
